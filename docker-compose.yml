services:
  postgres:
    image: postgres:17
    container_name: automated-eda-ml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: automated_eda_ml
      POSTGRES_USER: automated_eda_ml
      POSTGRES_PASSWORD: automated_eda_ml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U automated_eda_ml -d automated_eda_ml",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: automated-eda-ml-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://automated_eda_ml:automated_eda_ml@postgres:5432/automated_eda_ml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./datasets:/app/datasets
      - ./artifacts:/app/artifacts

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: automated-eda-ml-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.worker.ml_worker"]
    environment:
      - DATABASE_URL=postgresql://automated_eda_ml:automated_eda_ml@postgres:5432/automated_eda_ml
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./datasets:/app/datasets
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automated-eda-ml-frontend
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: