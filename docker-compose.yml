services:
  postgres:
    image: postgres:17
    container_name: automated-eda-ml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: automated_eda_ml
      POSTGRES_USER: automated_eda_ml
      POSTGRES_PASSWORD: automated_eda_ml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U automated_eda_ml -d automated_eda_ml",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: